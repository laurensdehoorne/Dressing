# Fixed project name, so the folder this lives in doesn't matter.
name: dressing

services:
  dressing:
    build:
      context: .
      args:
        VERSION: ${DRESSING_VERSION:-}
    container_name: dressing
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    # Only reachable from this machine; Tailscale serves it to your tailnet over HTTPS.
    # 8081 on the host, so it can run next to the Wijnkelder (8080).
    ports:
      - "127.0.0.1:8081:8080"
