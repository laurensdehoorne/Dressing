# Dressing enkel via Tailscale, met HTTPS (tailscale serve). Geen poort open op de host, dus het kan in dezelfde LXC
# naast Butler of de Wijnkelder draaien: elke app heeft zijn eigen Tailscale-container, hostnaam en tag.
# Gebruik: cp .env.example .env  (TS_AUTHKEY invullen)  →  docker compose -f compose.tailscale.yaml up -d --build
name: dressing

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: dressing-tailscale
    hostname: dressing
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=--advertise-tags=${TS_TAG:-tag:docker}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  dressing:
    build:
      context: .
      args:
        VERSION: ${DRESSING_VERSION:-}
    container_name: dressing
    restart: unless-stopped
    network_mode: service:tailscale   # deelt het netwerk van de Tailscale-container; enkel bereikbaar via de tailnet
    depends_on:
      - tailscale
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
